name: remote-deployment test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  remote-deployment:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          
          # Reuse previously cached derivations and dependencies even
          # when Nix expressions or the flake lockfile change.
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          
          # Leave enough room for large NixOS test dependencies.
          gc-max-store-size-linux: 10G

          # Keep older caches around for reuse.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-

          # Keep caches for at least 30 days since creation/access.
          purge-created: 2592000
          purge-last-accessed: P30D

          # Never purge the cache currently being generated.
          purge-primary-key: never

      - name: Run remote-deployment check
        run: nix build .#checks.x86_64-linux.remote-deployment -L
